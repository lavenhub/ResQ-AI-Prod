# Alembic configuration for ResQAI.
# The database URL is NOT hardcoded here — env.py reads it from the app settings
# (DATABASE_URL), so migrations always target the same DB as the app.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS-native path separators for version files.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
